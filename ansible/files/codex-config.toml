default_permissions = ":danger-full-access"
approval_policy = "never"

[mcp_servers.monarch_money]
command = "/home/bgub/.local/bin/uv"
args = [
  "run",
  "--project",
  "/home/bgub/.local/share/mcp/monarch-mcp-server",
  "mcp",
  "run",
  "/home/bgub/.local/share/mcp/monarch-mcp-server/src/monarch_mcp_server/server.py",
]

[mcp_servers.monarch_money.env]
HOME = "/home/bgub"
XDG_RUNTIME_DIR = "/run/user/1000"
DBUS_SESSION_BUS_ADDRESS = "unix:path=/run/user/1000/bus"
