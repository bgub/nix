start-at-login = true

# auto-tile into columns
after-login-command = []
after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

on-window-detected = [
  { if = 'test %{app-name} ~= gneiss', run = 'move-node-to-workspace 2' },
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# new windows tile to the right
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# mouse follows focus
on-focus-changed = ['move-mouse window-lazy-center']

# gaps
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]
ctrl-slash = 'layout tiles horizontal vertical'
ctrl-comma = 'layout accordion horizontal vertical'

ctrl-h = 'focus --boundaries all-monitors-outer-frame left'
ctrl-j = 'workspace next'
ctrl-k = 'workspace prev'
ctrl-l = 'focus --boundaries all-monitors-outer-frame right'

ctrl-shift-h = 'move --boundaries all-monitors-outer-frame left'
ctrl-shift-j = ['move-node-to-workspace next', 'workspace next']
ctrl-shift-k = ['move-node-to-workspace prev', 'workspace prev']
ctrl-shift-l = 'move --boundaries all-monitors-outer-frame right'

ctrl-cmd-shift-h = 'resize width +30'
ctrl-cmd-shift-l = 'resize width -30'
ctrl-cmd-shift-k = 'resize height +30'
ctrl-cmd-shift-j = 'resize height -30'

# Also reached through Kanata's Caps + 1-5/T layer.
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'

ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'
ctrl-shift-4 = 'move-node-to-workspace 4'
ctrl-shift-5 = 'move-node-to-workspace 5'
ctrl-shift-6 = 'move-node-to-workspace 6'

ctrl-tab = 'workspace-back-and-forth'
ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'
ctrl-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

ctrl-shift-h = ['join-with left', 'mode main']
ctrl-shift-j = ['join-with down', 'mode main']
ctrl-shift-k = ['join-with up', 'mode main']
ctrl-shift-l = ['join-with right', 'mode main']
